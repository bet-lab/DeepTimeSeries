# This is a basic workflow to help you get started with Actions
name: Build and Publish Documentation

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    # Public PR checks use an isolated GitHub-hosted runner; trusted events keep ml-main.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --all-groups
      - name: Build documentation
        run: |
          uv run sphinx-build -M html doc/source doc/build
      - name: Upload built documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: doc/build/html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: [self-hosted, ml-main]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download built documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation-html
          path: doc/build/html
      - name: Publish to Github Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/build/html
          force_orphan: true
